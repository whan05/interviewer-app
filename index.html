<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>IBM Full-Stack Flashcards & Speech Practice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="header-bar">
    <div class="counter-pill" id="counterLabel">01 / --</div>
    <div class="mode-tag" id="modeTag">PREGUNTA</div>
  </header>

  <main class="card-container">
    <div class="watermark-number" id="watermark">01</div>
    <div class="content-box">
      <div class="clickable-card-area" id="cardArea" title="Toca para ver u ocultar respuesta">
        <h1 class="view-question" id="questionText">Cargando preguntas...</h1>
        <div class="view-answer" id="answerText"></div>
      </div>
      <div class="tap-hint" id="tapHint">Toca el texto o presiona Espacio para alternar</div>
      <div class="voice-badge" id="voiceBadge">Voz: Detectando mejor acento US...</div>
      
      <div class="score-banner" id="scoreBanner">
        <span>Puntuación:</span> <strong id="scoreVal">0%</strong> — <span id="scoreGrade"></span>
      </div>
      <p class="speech-transcript" id="speechTranscript"></p>
    </div>
  </main>

  <footer class="controls">
    <button class="action-btn" id="btnPrev" type="button">
      <span>←</span> <span>Anterior</span>
    </button>
    <button class="action-btn" id="btnSpeak" type="button">
      <span id="speakerIcon">🔊</span> <span id="speakerLabel">Escuchar</span>
    </button>
    <button class="action-btn" id="btnMic" type="button">
      <span id="micIcon">🎙️</span> <span id="micLabel">Grabar</span>
    </button>
    <button class="action-btn primary" id="btnReveal" type="button">Ver respuesta</button>
    <button class="action-btn" id="btnNext" type="button">
      <span>Siguiente</span> <span>→</span>
    </button>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
