<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>IBM Full-Stack Flashcards & Speech Practice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    :root {
      --bg-gradient: radial-gradient(circle at 85% 75%, #1565C0 0%, #0D3875 35%, #051838 75%, #020B1C 100%);
      --text-main: #FFFFFF;
      --text-sub: rgba(255, 255, 255, 0.95);
      --watermark: rgba(255, 255, 255, 0.1);
      --badge-bg: rgba(255, 255, 255, 0.1);
      --btn-bg: rgba(255, 255, 255, 0.08);
      --btn-border: rgba(255, 255, 255, 0.22);
      --btn-hover: rgba(255, 255, 255, 0.22);
      --glow: rgba(255, 255, 255, 0.25);
    }
    body {
      background: var(--bg-gradient);
      background-size: 150% 150%;
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 28px 20px 24px;
      transition: background 0.8s ease;
      overflow-x: hidden;
      user-select: none;
    }
    .header-bar {
      width: 100%;
      max-width: 860px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .counter-pill {
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 700;
      padding: 7px 18px;
      border-radius: 999px;
      background: var(--badge-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--btn-border);
      color: rgba(255, 255, 255, 0.9);
    }
    .mode-tag {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: 700;
      color: var(--theme-accent, #64B5F6);
      transition: color 0.5s ease;
    }
    .card-container {
      position: relative;
      width: 100%;
      max-width: 860px;
      margin: auto;
      text-align: center;
      padding: 30px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 440px;
    }
    .watermark-number {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(14rem, 36vw, 25rem);
      font-weight: 800;
      color: var(--watermark);
      z-index: 1;
      pointer-events: none;
      line-height: 1;
      letter-spacing: -0.05em;
      filter: blur(2px);
      transition: color 0.6s ease;
    }
    .content-box {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .clickable-card-area {
      cursor: pointer;
      width: 100%;
      transition: transform 0.15s ease;
    }
    .clickable-card-area:hover .view-question {
      text-shadow: 0 6px 32px rgba(255, 255, 255, 0.3);
    }
    .view-question {
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.03em;
      color: #FFFFFF;
      text-shadow: 0 4px 28px rgba(0, 0, 0, 0.5);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .view-answer {
      display: none;
      font-size: clamp(1.35rem, 3vw, 2.05rem);
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: -0.015em;
      color: var(--text-sub);
      text-align: left;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      background: transparent;
      border: none;
      padding: 10px 0;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .view-answer strong {
      font-weight: 700;
      color: var(--theme-accent, #64B5F6);
    }
    .view-question.hidden { display: none; opacity: 0; }
    .view-answer.visible { display: block; opacity: 1; transform: translateY(0); }
    .tap-hint {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      opacity: 0.45;
      margin-top: 14px;
      font-weight: 600;
    }
    .voice-badge {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.55;
      margin-top: 6px;
      font-weight: 500;
    }
    .score-banner {
      display: none;
      margin-top: 24px;
      padding: 14px 24px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--btn-border);
      font-size: 1.05rem;
      font-weight: 600;
      color: #FFFFFF;
    }
    .score-banner.show { display: inline-flex; align-items: center; gap: 10px; }
    .speech-transcript {
      display: none;
      margin-top: 14px;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.75);
      max-width: 680px;
      font-style: italic;
      line-height: 1.5;
    }
    .speech-transcript.show { display: block; }
    .controls {
      position: relative;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }
    .action-btn {
      background: var(--btn-bg);
      color: #FFFFFF;
      border: 1px solid var(--btn-border);
      padding: 11px 22px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .action-btn:hover {
      background: var(--btn-hover);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px var(--glow);
    }
    .action-btn.primary {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.4);
    }
    .action-btn.recording {
      background: #D32F2F !important;
      border-color: #FF5252 !important;
      box-shadow: 0 0 22px rgba(244, 67, 54, 0.8) !important;
      animation: pulse 1.2s infinite;
    }
    .action-btn.speaking {
      background: var(--theme-accent, #0288D1) !important;
      border-color: #FFFFFF !important;
      box-shadow: 0 0 22px var(--glow) !important;
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <header class="header-bar">
    <div class="counter-pill" id="counterLabel">01 / --</div>
    <div class="mode-tag" id="modeTag">PREGUNTA</div>
  </header>

  <main class="card-container">
    <div class="watermark-number" id="watermark">01</div>
    <div class="content-box">
      <div class="clickable-card-area" onclick="toggleAnswer()" title="Toca para ver u ocultar respuesta">
        <h1 class="view-question" id="questionText">Cargando preguntas...</h1>
        <div class="view-answer" id="answerText"></div>
      </div>
      <div class="tap-hint" id="tapHint">Toca el texto para alternar</div>
      <div class="voice-badge" id="voiceBadge">Voz: Detectando mejor acento US...</div>
      
      <div class="score-banner" id="scoreBanner">
        <span>Puntuación:</span> <strong id="scoreVal">0%</strong> — <span id="scoreGrade"></span>
      </div>
      <p class="speech-transcript" id="speechTranscript"></p>
    </div>
  </main>

  <footer class="controls">
    <button class="action-btn" id="btnPrev" onclick="prevCard()">
      <span>←</span> <span>Anterior</span>
    </button>
    <button class="action-btn" id="btnSpeak" onclick="toggleSpeech()">
      <span id="speakerIcon">🔊</span> <span id="speakerLabel">Escuchar</span>
    </button>
    <button class="action-btn" id="btnMic" onclick="toggleRecording()">
      <span id="micIcon">🎙️</span> <span id="micLabel">Grabar</span>
    </button>
    <button class="action-btn primary" id="btnReveal" onclick="toggleAnswer()">Ver respuesta</button>
    <button class="action-btn" id="btnNext" onclick="nextCard()">
      <span>Siguiente</span> <span>→</span>
    </button>
  </footer>

  <script>
    const palettes = [
      {
        bg: 'radial-gradient(circle at 85% 75%, #1565C0 0%, #0D3875 35%, #051838 75%, #020B1C 100%)',
        watermark: 'rgba(100, 181, 246, 0.12)',
        modeColor: '#64B5F6',
        glow: 'rgba(21, 101, 192, 0.45)'
      },
      {
        bg: 'radial-gradient(circle at 80% 80%, #00897B 0%, #004D40 35%, #02231E 75%, #01110E 100%)',
        watermark: 'rgba(77, 182, 172, 0.13)',
        modeColor: '#4DB6AC',
        glow: 'rgba(0, 137, 123, 0.45)'
      },
      {
        bg: 'radial-gradient(circle at 85% 75%, #6A1B9A 0%, #4A148C 35%, #250949 75%, #100322 100%)',
        watermark: 'rgba(186, 104, 200, 0.13)',
        modeColor: '#CE93D8',
        glow: 'rgba(106, 27, 154, 0.45)'
      },
      {
        bg: 'radial-gradient(circle at 80% 80%, #C2185B 0%, #880E4F 35%, #420424 75%, #1E0110 100%)',
        watermark: 'rgba(240, 98, 146, 0.13)',
        modeColor: '#F48FB1',
        glow: 'rgba(194, 24, 91, 0.45)'
      },
      {
        bg: 'radial-gradient(circle at 75% 70%, #E65100 0%, #BF360C 35%, #561603 75%, #260900 100%)',
        watermark: 'rgba(255, 171, 145, 0.13)',
        modeColor: '#FFAB91',
        glow: 'rgba(230, 81, 0, 0.45)'
      },
      {
        bg: 'radial-gradient(circle at 85% 75%, #0097A7 0%, #006064 35%, #002D33 75%, #001518 100%)',
        watermark: 'rgba(77, 208, 225, 0.13)',
        modeColor: '#4DD0E1',
        glow: 'rgba(0, 151, 167, 0.45)'
      },
      {
        bg: 'radial-gradient(circle at 80% 80%, #AD1457 0%, #6A1B9A 35%, #350849 75%, #160220 100%)',
        watermark: 'rgba(244, 143, 177, 0.13)',
        modeColor: '#F48FB1',
        glow: 'rgba(173, 20, 87, 0.45)'
      },
      {
        bg: 'radial-gradient(circle at 75% 70%, #8D6E63 0%, #4E342E 35%, #261612 75%, #120A08 100%)',
        watermark: 'rgba(215, 204, 200, 0.13)',
        modeColor: '#D7CCC8',
        glow: 'rgba(141, 110, 99, 0.45)'
      }
    ];

    const cards = [
      {
        pregunta: "Tell me about yourself and your background in full-stack development.",
        respuesta: "Certainly! I am Whanderley, a Full-Stack and AI Software Engineer based in Costa Rica with over five years of professional experience building web and mobile applications. Currently, at Bee Loyal Card, I lead end-to-end development across NestJS backends, Python automation routines, and React/Angular frontends, backed by PostgreSQL, MongoDB, and Redis caching. My daily responsibilities involve architecting REST and GraphQL APIs, designing digital pass systems for Apple Wallet and Google Wallet, and integrating LLMs using RAG pipelines with pgvector. Before this, I built enterprise UI components at Globant and Accenture maintaining 80% test coverage with Jest, and started my journey in 2018 in technical support and SQL administration at Logosoft. I bring deep architecture, hands-on data engineering, and proactive client-facing problem solving."
      },
      {
        pregunta: "Why are you interested in joining IBM Consulting, and how does your background fit a client-facing role?",
        respuesta: "I am drawn to IBM Consulting because of its commitment to long-term digital transformation and enterprise data platforms like Snowflake. Throughout my career at Bee Loyal Card, Globant, and Accenture, I have routinely interfaced with business stakeholders to translate commercial objectives into solid technical architectures. My combined background in full-stack development, LLM integrations, and customer-first support from Logosoft allows me to communicate technical trade-offs transparently to enterprise clients while ensuring resilient delivery."
      },
      {
        pregunta: "How do you participate in Agile delivery workflows, such as Scrum or Kanban?",
        respuesta: "Situation: At Bee Loyal Card and Globant, our teams operated in fast-paced two-week Scrum sprints with cross-functional pods. Task: My responsibility was to ensure predictable sprint delivery, decompose complex feature requests, and maintain code quality without bottlenecks. Action: I actively participated in daily stand-ups to raise blockers early, collaborated with product managers during refinement to break epics into granular Jira user stories with precise acceptance criteria, and drove automated CI/CD pipeline checks. Result: We maintained consistent sprint velocity with over 90% commitment completion and reduced deployment regressions across releases."
      },
      {
        pregunta: "Describe a situation where you had to collaborate with non-technical stakeholders to clarify ambiguous requirements.",
        respuesta: "Situation: At Bee Loyal Card, commercial stakeholders requested an automated loyalty tier reward engine, but the business rules and point calculation triggers were undefined. Task: I needed to bridge the gap between commercial concepts and backend engineering before writing production logic. Action: I facilitated discovery workshops where I mapped user journeys using interactive wireframes and state diagrams. I translated their marketing goals into deterministic NestJS domain services and explicit DTO validation schemas. Result: We shipped the loyalty reward feature on schedule with zero rework, eliminating ambiguities and ensuring high client satisfaction."
      },
      {
        pregunta: "How do you approach code reviews and maintain clean, maintainable code across a software development team?",
        respuesta: "Situation: Working across distributed teams at Globant and Bee Loyal Card, code quality directly impacted multi-tenant stability. Task: I was tasked with establishing rigorous review standards and mentoring peers on maintainability. Action: In pull requests, I systematically evaluated adherence to SOLID principles, modular NestJS DTO boundaries, and test coverage. At Globant, we integrated SonarQube gates requiring at least 80% coverage with Jest. Result: This proactive review culture caught architectural smells and security vulnerabilities pre-merge, significantly lowering production bug escape rates."
      },
      {
        pregunta: "How do you structure a scalable React and TypeScript application for enterprise environments?",
        respuesta: "To build scalable React applications, I structure projects by feature domains rather than technical file types. I decouple UI presentation from business logic using custom hooks for state and asynchronous API orchestration. TypeScript is central: I enforce strict interfaces, discriminated unions for state machines, and typed API response contracts. At Bee Loyal Card and Globant, this pattern enabled our team to build shared component design systems that scaled cleanly as feature complexity grew."
      },
      {
        pregunta: "How do you manage state across complex full-stack web applications?",
        respuesta: "I categorize state by lifecycle and scope. For localized component interactions, I rely on useState and useReducer. For global UI state—like user authentication tokens and active reward sessions—I utilize Redux or Zustand. Crucially, at Bee Loyal Card and Globant, I isolate server cache from client state by using asynchronous query patterns and Redis caching on the backend, preventing stale server data from polluting frontend stores."
      },
      {
        pregunta: "What is your approach to automated frontend testing, and how do you ensure high software reliability?",
        respuesta: "Situation: At Globant, our enterprise client required strict release verification for client-facing web portals. Task: I was responsible for authoring unit and integration suites to uphold an 80% automated test coverage threshold. Action: Using Jest and React Testing Library, I prioritized testing user behaviors over internal implementation details—testing form validations, state mutations, and accessibility trees. I also created Playwright end-to-end smoke tests for critical onboarding funnels. Result: We maintained over 80% verified test coverage, successfully blocking regressions before every production deployment."
      },
      {
        pregunta: "How do you inspect and optimize web application performance and UI rendering?",
        respuesta: "Situation: At Bee Loyal Card, our administrative analytics dashboard experienced rendering lag with large real-time datasets. Task: I needed to diagnose UI bottlenecks and reduce initial load times. Action: I used Chrome DevTools Performance and Network tabs to identify excessive component re-renders and bloated bundle chunks. I applied React.memo, useMemo, and useCallback on high-frequency tables, and implemented code-splitting with dynamic React.lazy and Suspense boundaries. Result: We achieved a 40% reduction in initial bundle size and maintained a smooth 60 FPS rendering experience during real-time data streaming."
      },
      {
        pregunta: "Can you explain the differences between Client-Side Rendering (CSR) and Server-Side Rendering (SSR) in Next.js?",
        respuesta: "Client-Side Rendering (CSR) downloads a minimal HTML shell and renders components entirely in the browser via JavaScript, making it great for private dashboards behind auth, but vulnerable to slower first-contentful-paint. Server-Side Rendering (SSR) in Next.js renders HTML dynamically on the server per request, providing instant paint times and superior SEO indexing. In my projects, I use SSR for public discovery pages and marketing funnels, and CSR for internal data-heavy portals."
      },
      {
        pregunta: "How do you design and implement scalable RESTful APIs using NestJS and Node.js?",
        respuesta: "Situation: At Bee Loyal Card, our loyalty backend required high-throughput API endpoints to handle mobile apps and third-party integrations. Task: Architect a maintainable, loosely coupled REST API service. Action: I implemented NestJS modular architecture, dividing responsibilities into Controllers for routing, Services for business logic, and DTOs with class-validator pipes to sanitize inputs. I leveraged NestJS dependency injection and standard HTTP semantics. Result: The resulting API handled hundreds of concurrent transactions with predictable sub-100ms response times and clear OpenAPI documentation."
      },
      {
        pregunta: "How do you handle backend business logic and complex parameter calculations?",
        respuesta: "Situation: At Bee Loyal Card, customer reward calculations depended on complex combinations of purchase frequency, promotional multipliers, and merchant rules. Task: Build an extensible calculation engine that could be audited and unit-tested without database dependencies. Action: I created dedicated domain service classes in NestJS that isolated calculation formulas from persistence layers, passing pure DTO payloads and covering edge cases with Jest unit tests. Result: We processed dynamic reward parameters with zero rounding errors, persisted validated logs in PostgreSQL, and enabled easy promotional updates."
      },
      {
        pregunta: "How do you implement authentication, authorization, and basic application security in web APIs?",
        respuesta: "Security must be enforced at every layer. For authentication, I implement JSON Web Tokens (JWT) with short expiration windows and secure refresh rotation. In NestJS, I use custom ExecutionContext Guards combined with Role-Based Access Control (RBAC) decorators to restrict sensitive endpoints. Furthermore, I sanitize all database interactions via parameterized SQL and Prisma/TypeORM, configure strict CORS policies, rate-limiting headers, and end-to-end TLS encryption."
      },
      {
        pregunta: "What strategies do you use for backend error handling, logging, and production incident resolution?",
        respuesta: "Situation: In production environments at Bee Loyal Card, unhandled exceptions risked downtime and leaked stack traces. Task: Establish a unified incident detection and structured error handling protocol. Action: In NestJS, I authored global Exception Filters to catch unhandled errors and format standardized JSON error envelopes. I integrated Sentry for automated anomaly alerts and structured server logs with correlation IDs. Result: We eliminated raw error leaks, lowered Mean Time to Detect (MTTD) to minutes, and systematically pinpointed failures between API, network, or database layers."
      },
      {
        pregunta: "How do you manage third-party API integrations and asynchronous data processing?",
        respuesta: "Situation: At Bee Loyal Card, we integrated digital pass services with Apple Wallet and Google Wallet, which required real-time push updates. Task: Reliably transmit pass updates without blocking main thread API requests. Action: I developed asynchronous worker services using NestJS HttpModule and Axios, wrapping external requests with exponential backoff retries and timeout boundaries. I utilized webhook verification and Redis queues for batching pass notifications. Result: We achieved 99.9% pass update delivery rates while keeping client-facing endpoints responsive."
      },
      {
        pregunta: "How do you approach relational database schema design and normalization?",
        respuesta: "I approach database design by mapping domain relationships and querying access patterns. I apply normalization up to Third Normal Form (3NF) to eliminate data duplication and enforce referential integrity with foreign key constraints, unique indexes, and non-null guarantees. Across PostgreSQL and MySQL at Bee Loyal Card and Logosoft, I also strategically introduce composite indexes on high-frequency filtering columns to optimize read performance without harming write throughput."
      },
      {
        pregunta: "How do you write and optimize complex SQL queries for operational data workflows?",
        respuesta: "Situation: At Bee Loyal Card and Logosoft, multi-table analytics queries on customer transaction logs began causing latency spikes. Task: Optimize query execution times for real-time reporting dashboards. Action: I executed EXPLAIN ANALYZE to identify sequential table scans and memory-heavy sorts. I refactored inefficient nested subqueries into indexed INNER and LEFT JOINs, eliminated SELECT * statements, and created partial B-tree indexes. Result: Query execution dropped from over 2.4 seconds to under 120 milliseconds, drastically reducing CPU load on our PostgreSQL instances."
      },
      {
        pregunta: "How do you debug data-related issues, query performance bottlenecks, and schema discrepancies?",
        respuesta: "Situation: In enterprise production at Logosoft and Bee Loyal Card, inconsistent reward totals appeared between frontend summaries and database ledgers. Task: Perform root-cause debugging to isolate where data corruption or transformation discrepancies occurred. Action: I traced the request from client DevTools through backend payload parsers, and executed direct queries in PostgreSQL with transaction isolation levels to check for race conditions and type coercion. Result: I discovered an unhandled async race condition, resolved it with atomic database transactions (BEGIN/COMMIT), and wrote regression tests to guarantee data consistency."
      },
      {
        pregunta: "What is your understanding of cloud data platforms like Snowflake and their role in data-driven full-stack applications?",
        respuesta: "While transactional databases like PostgreSQL are built for row-based OLTP workflows, cloud platforms like Snowflake are optimized for columnar OLAP analytics. In enterprise architectures like IBM's, Snowflake serves as the centralized data lakehouse. Full-stack applications interact with Snowflake via REST APIs or high-performance drivers to pull aggregated business intelligence and historical trends into client dashboards, leveraging elastic virtual warehouses for sub-second analytical queries without competing with transactional workloads."
      },
      {
        pregunta: "How do you maintain data quality, data integrity, and basic governance in application data workflows?",
        respuesta: "Data quality requires validation across the entire data lifecycle. At the API boundary in NestJS, I use class-validator pipes with strict type schemas to block malformed payloads before they reach controllers. At the database level, I enforce strict column constraints (CHECK, UNIQUE, NOT NULL) and wrap multi-step ledger writes in atomic ACID transactions. In modern AI workflows, I also validate schema outputs from LLMs before storing embeddings into PostgreSQL pgvector."
      },
      {
        pregunta: "Can you explain client-server architecture and key HTTP protocol fundamentals?",
        respuesta: "Client-server architecture separates presentation and interaction layers from backend business logic and data persistence over a network. The client initiates HTTP requests, and the server processes them statelessly. Key HTTP fundamentals include idempotent methods (GET, PUT, DELETE) versus non-idempotent methods (POST), headers for authorization and content negotiation, and standard status codes like 200 OK, 201 Created, 400 Bad Request, 401 Unauthorized, and 500 Internal Server Error."
      },
      {
        pregunta: "How do you utilize Docker containers in your software development and deployment workflows?",
        respuesta: "Situation: At Bee Loyal Card, onboarded developers and cloud staging environments suffered from minor environment drifts. Task: Standardize our local and cloud runtime environments. Action: I created multi-stage Dockerfiles for our NestJS backends and React frontends, separating build artifacts from lean production runtimes. Using docker-compose, I configured a unified development stack orchestrating the API, PostgreSQL, and Redis with a single command. Result: We eliminated 'works on my machine' issues and cut CI/CD build deployment times across AWS by 35%."
      },
      {
        pregunta: "What experience do you have with cloud platforms such as AWS and CI/CD pipelines?",
        respuesta: "In my engineering roles at Bee Loyal Card and freelance projects, I manage deployments across AWS services, including EC2 instances, S3 buckets with CloudFront for static frontend hosting, and containerized backends. I build CI/CD pipelines using GitHub Actions: on pull request merge, automated workflows run Jest test suites, execute SonarQube static analysis, build Docker containers, and trigger zero-downtime rolling deployments."
      },
      {
        pregunta: "How do you approach root-cause analysis when a critical incident occurs across the application stack?",
        respuesta: "Situation: In a high-traffic production release at Bee Loyal Card, mobile users experienced intermittent authentication failures. Task: Swiftly stabilize the platform and diagnose root cause under SLA pressure. Action: Drawing on my root-cause support training from Logosoft, I followed a three-step triage: first, inspected client-side HTTP status codes; second, correlated server logs and Sentry exception traces to identify expired token handshakes; third, inspected Redis connection pool limits. Result: I resolved the connection bottleneck in Redis, pushed a hotfix within 30 minutes, and added proactive pool health checks to prevent recurrences."
      },
      {
        pregunta: "How do you leverage AI-assisted tools like Claude Code and ChatGPT Codex in your software engineering workflow?",
        respuesta: "Situation: At Bee Loyal Card, rapid feature delivery required accelerating boilerplate tasks while maintaining strict code standards. Task: Integrate AI tooling into daily engineering to boost productivity and implement production AI features. Action: I use Claude Code and Cursor to scaffold repetitive CRUD structures, generate edge-case Jest unit tests, and draft complex SQL queries. Beyond developer tooling, I built production RAG workflows integrating OpenAI and Gemini APIs with PostgreSQL pgvector. Result: This increased my personal engineering throughput by over 40% while ensuring all AI-generated code underwent human review, strict typing, and automated testing."
      }
    ];

    let currentIndex = 0;
    let showingAnswer = false;

    // --- RECONOCIMIENTO DE VOZ CONTINUO A PRUEBA DE CORTES ---
    let recognition = null;
    let isRecording = false;
    let fullTranscript = '';
    let finalAccumulatedText = '';
    let restartTimer = null;

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

    function buildSpeechEngine() {
      if (!SpeechRec) return null;
      const rec = new SpeechRec();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = 'en-US';

      rec.onresult = (event) => {
        let interimTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const piece = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalAccumulatedText += (finalAccumulatedText ? ' ' : '') + piece.trim();
          } else {
            interimTranscript += piece;
          }
        }
        fullTranscript = (finalAccumulatedText + ' ' + interimTranscript).trim();
        const transcriptEl = document.getElementById('speechTranscript');
        transcriptEl.textContent = `Dijiste: "${fullTranscript}"`;
        transcriptEl.classList.add('show');
      };

      rec.onerror = (event) => {
        if (event.error === 'no-speech' || event.error === 'network') return;
        console.warn('SpeechRecognition error:', event.error);
      };

      rec.onend = () => {
        if (isRecording) {
          clearTimeout(restartTimer);
          restartTimer = setTimeout(() => {
            if (isRecording) {
              try {
                recognition = buildSpeechEngine();
                recognition.start();
              } catch (e) {
                console.log('Error al reanudar rec:', e);
              }
            }
          }, 60);
        }
      };

      return rec;
    }

    // --- SÍNTESIS DE VOZ NATURAL (PRIORIDAD VOCES NEURAL / NATURAL / ENHANCED) ---
    let isSpeaking = false;
    let selectedVoice = null;

    function getBestAmericanVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      if (!voices || voices.length === 0) return null;

      let voice = voices.find(v => (v.lang === 'en-US' || v.lang === 'en_US') && 
        (v.name.includes('Natural') || v.name.includes('Online (Natural)')));

      if (!voice) {
        voice = voices.find(v => (v.lang === 'en-US' || v.lang === 'en_US') && 
          (v.name.includes('Enhanced') || v.name.includes('Premium') || v.name.includes('Ava') || v.name.includes('Allison')));
      }

      if (!voice) {
        voice = voices.find(v => (v.lang === 'en-US' || v.lang === 'en_US') && v.name.includes('Google US English'));
      }

      if (!voice) {
        voice = voices.find(v => (v.lang === 'en-US' || v.lang === 'en_US') && (v.name.includes('Samantha') || v.name.includes('David')));
      }

      if (!voice) {
        voice = voices.find(v => v.lang === 'en-US' || v.lang === 'en_US' || v.lang.startsWith('en'));
      }

      return voice;
    }

    function updateVoiceSelection() {
      selectedVoice = getBestAmericanVoice();
      const badge = document.getElementById('voiceBadge');
      if (selectedVoice) {
        const cleanName = selectedVoice.name.replace('Microsoft ', '').replace('Online (Natural) - ', '').replace('English (United States)', '').trim();
        badge.textContent = `Voz activa: ${cleanName} (en-US)`;
      } else {
        badge.textContent = 'Voz activa: Estándar (en-US)';
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = updateVoiceSelection;
      updateVoiceSelection();
    }

    function toggleSpeech() {
      if (!('speechSynthesis' in window)) {
        alert('La síntesis de voz no está soportada en tu navegador.');
        return;
      }
      if (isSpeaking) {
        stopSpeech();
      } else {
        startSpeech();
      }
    }

    function startSpeech() {
      window.speechSynthesis.cancel();
      if (isRecording) stopRecording();

      const textToRead = cards[currentIndex].respuesta;
      const utterance = new SpeechSynthesisUtterance(textToRead);
      utterance.lang = 'en-US';
      utterance.rate = 0.94;
      utterance.pitch = 1.0;

      if (!selectedVoice) updateVoiceSelection();
      if (selectedVoice) utterance.voice = selectedVoice;

      utterance.onstart = () => {
        isSpeaking = true;
        const btn = document.getElementById('btnSpeak');
        btn.classList.add('speaking');
        document.getElementById('speakerIcon').textContent = '⏹️';
        document.getElementById('speakerLabel').textContent = 'Pausar';
      };

      utterance.onend = () => {
        stopSpeechUI();
      };

      utterance.onerror = () => {
        stopSpeechUI();
      };

      if (!showingAnswer) {
        toggleAnswer();
      }

      window.speechSynthesis.speak(utterance);
    }

    function stopSpeech() {
      window.speechSynthesis.cancel();
      stopSpeechUI();
    }

    function stopSpeechUI() {
      isSpeaking = false;
      const btn = document.getElementById('btnSpeak');
      btn.classList.remove('speaking');
      document.getElementById('speakerIcon').textContent = '🔊';
      document.getElementById('speakerLabel').textContent = 'Escuchar';
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderCard();
      setTimeout(updateVoiceSelection, 300);
    });

    function applyPalette(index) {
      const p = palettes[index % palettes.length];
      const root = document.documentElement;
      root.style.setProperty('--bg-gradient', p.bg);
      root.style.setProperty('--watermark', p.watermark);
      root.style.setProperty('--glow', p.glow);
      root.style.setProperty('--theme-accent', p.modeColor);
      document.getElementById('modeTag').style.color = p.modeColor;
    }

    function formatAnswerHTML(text) {
      return text
        .replace(/\bSituation:/g, '<strong>Situation:</strong>')
        .replace(/\bTask:/g, '<strong>Task:</strong>')
        .replace(/\bAction:/g, '<strong>Action:</strong>')
        .replace(/\bResult:/g, '<strong>Result:</strong>');
    }

    function renderCard() {
      stopSpeech();
      const card = cards[currentIndex];
      const displayNum = String(currentIndex + 1).padStart(2, '0');

      applyPalette(currentIndex);

      document.getElementById('watermark').textContent = displayNum;
      document.getElementById('counterLabel').textContent = `${displayNum} / ${String(cards.length).padStart(2, '0')}`;
      document.getElementById('questionText').textContent = card.pregunta;
      document.getElementById('answerText').innerHTML = formatAnswerHTML(card.respuesta);

      resetSpeechFeedback();
      showingAnswer = false;
      showQuestionView();
    }

    function resetSpeechFeedback() {
      if (isRecording) stopRecording();
      fullTranscript = '';
      finalAccumulatedText = '';
      document.getElementById('scoreBanner').classList.remove('show');
      document.getElementById('speechTranscript').classList.remove('show');
    }

    function showQuestionView() {
      const q = document.getElementById('questionText');
      const a = document.getElementById('answerText');
      const btn = document.getElementById('btnReveal');
      const tag = document.getElementById('modeTag');

      a.classList.remove('visible');
      setTimeout(() => {
        a.style.display = 'none';
        q.style.display = 'block';
        setTimeout(() => q.classList.remove('hidden'), 20);
      }, 150);

      btn.textContent = 'Ver respuesta';
      tag.textContent = 'PREGUNTA';
    }

    function showAnswerView() {
      const q = document.getElementById('questionText');
      const a = document.getElementById('answerText');
      const btn = document.getElementById('btnReveal');
      const tag = document.getElementById('modeTag');

      q.classList.add('hidden');
      setTimeout(() => {
        q.style.display = 'none';
        a.style.display = 'block';
        setTimeout(() => a.classList.add('visible'), 20);
      }, 150);

      btn.textContent = 'Ver pregunta';
      tag.textContent = 'RESPUESTA';
    }

    function toggleAnswer() {
      showingAnswer = !showingAnswer;
      if (showingAnswer) showAnswerView();
      else showQuestionView();
    }

    function prevCard() {
      currentIndex = (currentIndex - 1 + cards.length) % cards.length;
      renderCard();
    }

    function nextCard() {
      currentIndex = (currentIndex + 1) % cards.length;
      renderCard();
    }

    function toggleRecording() {
      if (!SpeechRec) {
        alert('Usa Google Chrome o Microsoft Edge para soporte completo de micrófono.');
        return;
      }
      stopSpeech();
      if (isRecording) stopRecording();
      else startRecording();
    }

    function startRecording() {
      fullTranscript = '';
      finalAccumulatedText = '';
      document.getElementById('speechTranscript').classList.remove('show');
      document.getElementById('scoreBanner').classList.remove('show');

      isRecording = true;
      const btn = document.getElementById('btnMic');
      btn.classList.add('recording');
      document.getElementById('micLabel').textContent = 'Detener';
      document.getElementById('micIcon').textContent = '⏹️';

      try {
        if (recognition) {
          try { recognition.abort(); } catch (e) {}
        }
        recognition = buildSpeechEngine();
        recognition.start();
      } catch (err) {
        console.warn('Error al iniciar micrófono:', err);
      }
    }

    function stopRecording() {
      isRecording = false;
      clearTimeout(restartTimer);

      const btn = document.getElementById('btnMic');
      btn.classList.remove('recording');
      document.getElementById('micLabel').textContent = 'Grabar';
      document.getElementById('micIcon').textContent = '🎙️';

      if (recognition) {
        try { recognition.stop(); } catch (e) {}
      }

      setTimeout(() => {
        evaluateAccuracy(fullTranscript, cards[currentIndex].respuesta);
      }, 500);
    }

    function evaluateAccuracy(userSpeech, targetAnswer) {
      if (!userSpeech || userSpeech.trim().length === 0) {
        alert('No se detectaron palabras en inglés. Asegúrate de hablar claro y probar nuevamente.');
        return;
      }

      const clean = (text) => text.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(w => w.length > 2);
      const userWords = new Set(clean(userSpeech));
      const targetWords = clean(targetAnswer);

      if (targetWords.length === 0) return;

      let matches = 0;
      targetWords.forEach(word => {
        if (userWords.has(word)) matches++;
      });

      let coverage = (matches / targetWords.length) * 100;
      let score = Math.min(100, Math.round(coverage * 1.35));
      if (userWords.size >= 8 && score < 40) score = 45;

      const banner = document.getElementById('scoreBanner');
      const scoreVal = document.getElementById('scoreVal');
      const scoreGrade = document.getElementById('scoreGrade');

      scoreVal.textContent = `${score}%`;

      if (score >= 80) {
        scoreGrade.textContent = '🌟 ¡Excelente dominio!';
        scoreVal.style.color = '#4CAF50';
      } else if (score >= 55) {
        scoreGrade.textContent = '👍 Buena respuesta, cubre los puntos clave';
        scoreVal.style.color = '#FFCA28';
      } else {
        scoreGrade.textContent = '💡 Puedes detallar más conceptos técnicos';
        scoreVal.style.color = '#FF8A65';
      }

      banner.classList.add('show');
      if (!showingAnswer) toggleAnswer();
    }
  </script>
